 in his pocket the whole time!\",\"fa\":\"کلیدها همه‌ی این مدت در جیبش بودن!\"},{\"en\":\"Tom laughs. 'I am so silly!' he says.\",\"fa\":\"تام می‌خندد و می‌گوید: «من چقدر احمقانه رفتار کردم!»\"},{\"en\":\"They drink one more coffee together.\",\"fa\":\"آن‌ها با هم یک قهوه‌ی دیگر می‌نوشند.\"}],\"quiz\":[{\"id\":\"q1\",\"prompt\":\"تام هر صبح چه می‌خورد؟\",\"options\":[\"چای و نان\",\"قهوه و کرواسان\",\"آب و سیب\",\"شیر و کیک\"],\"correctIndex\":1,\"explain\":\"در متن آمده: He loves coffee and croissants.\"},{\"id\":\"q2\",\"prompt\":\"کلیدها آخر کار کجا بودند؟\",\"options\":[\"روی میز\",\"زیر صندلی\",\"در جیب تام\",\"نزد سارا\"],\"correctIndex\":2,\"explain\":\"سارا به جیب تام اشاره می‌کند — کلیدها آنجا بودن.\"},{\"id\":\"q3\",\"prompt\":\"تام در پایان چه می‌گوید؟\",\"options\":[\"«من عصبانی‌ام!»\",\"«من خسته‌ام.»\",\"«من چقدر احمقانه بودم!»\",\"«من گرسنه‌ام.»\"],\"correctIndex\":2,\"explain\":\"تاب می‌گوید: 'I am so silly!'\"}]}}]\n10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#ffffff\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0a0a0a\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n14:I[27201,[\"/_next/static/chunks/3_b_uhvftfm4a.js\",\"/_next/static/chunks/1ismpvj_0gn5v.js\",\"/_next/static/chunks/02wf7wd16vqvf.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"ZabanYar — تمرین زبان با هوش مصنوعی\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"اپلیکیشن هوشمند آموزش و تمرین زبان انگلیسی از A0 تا C2: مکالمه صوتی با هوش مصنوعی، پادکست‌های دوزبانه، آزمون جامع استادی و گواهی تسلط.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"ZabanYar\"}],[\"$\",\"meta\",\"3\",{\"name\":\"format-detection\",\"content\":\"telephone=no\"}],[\
